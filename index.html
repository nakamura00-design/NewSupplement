<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewSupplement パウチとピルの試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,700;1,800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D stage, brand top-left, one control dock at the bottom, news card top-right */
  --sky:#e2ebfb;        /* stage background, same family as the logo backdrop */
  --ink:#16306b;        /* text, a navy biased toward the brand blue */
  --ink-soft:#5a6f9c;
  --brand:#3d74ee;      /* logo "New" blue */
  --brand-light:#8fd0fb;/* logo capsule blue */
  --surface:rgba(255,255,255,.78);
  --line:rgba(40,80,170,.16);
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --font-display:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6;overflow:hidden}
#stage{position:fixed;inset:0}
#gl{width:100%;height:100%;display:block;touch-action:manipulation}
.brand{position:fixed;left:16px;top:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.brand b{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--brand)}
.brand b span{color:#7fbdf6}
.brand small{color:var(--ink-soft);font-size:12px}
.hint{position:fixed;left:50%;bottom:calc(var(--dock-h,150px) + 26px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;pointer-events:none;white-space:nowrap}
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(40,80,170,.12)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > .lbl{font-size:12px;color:var(--ink-soft);font-weight:700;min-width:3.5em}
button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
button:hover{border-color:var(--brand)}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{width:16px;height:20px;border-radius:4px;flex:none;border:2px solid transparent}
.sw.blue{background:linear-gradient(#3a74ec,#8fd0fb)}
.sw.duo{background:linear-gradient(#3a74ec 50%,#dcd8fa 50%)}
.sw.silver{background:linear-gradient(#0f2a7a,#2a5fd6);border-color:#c3ccd8}
.sw.gold{background:linear-gradient(#0f2a7a,#2a5fd6);border-color:#d8b052}
.spacer{flex:1}
.card{position:fixed;right:16px;top:14px;width:min(340px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:0 14px 40px rgba(40,80,170,.18)}
.card[hidden]{display:none}
.card .eyebrow{font-size:11px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:1px 8px;display:inline-block}
.card h2{font-size:17px;line-height:1.45;margin:8px 0 10px;font-weight:900;text-wrap:balance}
.card dl{margin:0;border-top:2px solid var(--ink);font-size:12.5px}
.card dl div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.card dt{font-weight:700}
.card dd{margin:0;color:var(--ink-soft);text-align:right}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.card .x{padding:3px 10px;font-size:12px}
.flat{position:fixed;inset:0;background:var(--sky);overflow:auto;padding:64px 16px 190px}
.flat[hidden]{display:none}
.flat p{max-width:60ch;margin:0 auto 16px;color:var(--ink-soft)}
.flat .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:980px;margin:0 auto}
@media (max-width:640px){.flat .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flat figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.flat canvas{width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(40,80,170,.25))}
.flat figcaption{font-weight:700;font-size:13px}
.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink-soft);font-weight:700}
@media (max-width:520px){.brand small{display:none}.card{top:52px}}
</style>
</head>
<body>
<div id="stage"><canvas id="gl" aria-label="パウチとピルの3D表示"></canvas></div>
<div class="msg" id="msg">読み込み中…</div>

<div class="brand"><b>New<span>Supplement</span></b><small>パウチとピルの試作　パウチをタップ → ピルをタップ</small></div>
<div class="hint" id="hint">パウチをタップして開封</div>

<section class="flat" id="flat" hidden>
  <p id="flatNote">ラベルの平面図です。上が表面、下が裏面（成分表示）。</p>
  <div class="grid" id="flatGrid"></div>
</section>

<aside class="card" id="card" hidden aria-live="polite">
  <span class="eyebrow">サンプル表示</span>
  <h2>ここに、処方されたニュースの見出しが入ります</h2>
  <dl>
    <div><dt>分野</dt><dd id="cGenre">—</dd></div>
    <div><dt>出典</dt><dd>媒体名・記事リンク</dd></div>
    <div><dt>種別</dt><dd>一次情報 / 論評</dd></div>
    <div><dt>発信日</dt><dd>年月日</dd></div>
  </dl>
  <div class="foot"><span id="cDose">本日 1 / 3 錠</span><button class="x" id="cClose" type="button">閉じる</button></div>
</aside>

<div class="dock" id="dock">
  <div class="row" id="variants" role="group" aria-label="パウチのデザイン">
    <span class="lbl">パウチ</span>
    <button type="button" data-v="0" aria-pressed="true"><i class="sw blue"></i>全面ブルー</button>
    <button type="button" data-v="1" aria-pressed="false"><i class="sw duo"></i>上ブルー・下ラベンダー</button>
    <button type="button" data-v="2" aria-pressed="false"><i class="sw silver"></i>シルバー縁</button>
    <button type="button" data-v="3" aria-pressed="false"><i class="sw gold"></i>ゴールド縁</button>
  </div>
  <div class="row">
    <span class="lbl">錠数</span>
    <span class="row" id="counts" role="group" aria-label="1回に出す錠数">
      <button type="button" data-n="3" aria-pressed="true">3錠（1日分）</button>
      <button type="button" data-n="8" aria-pressed="false">8錠（検証用）</button>
      <button type="button" data-n="16" aria-pressed="false">16錠（検証用）</button>
    </span>
    <span class="spacer"></span>
    <button type="button" id="bShake">ゆらす</button>
    <button type="button" id="bSound" aria-pressed="true">音</button>
    <button type="button" id="bFlat" aria-pressed="false">ラベル平面図</button>
    <button type="button" id="bReset">リセット</button>
  </div>
</div>

  for(let k=1;k<=N;k++){const a=k/N*Math.PI/2;prof.push([sign*(L/2-R+R*Math.sin(a)),R*Math.cos(a),sign*Math.sin(a),Math.cos(a)])}
  const S=48,pos=[],nor=[],col=[],idx=[];
  prof.forEach(p=>{const t=Math.abs(p[0])/(L/2)*(stops.length-1),i0=Math.min(stops.length-2,Math.floor(t)),f=t-i0,A=stops[i0],B=stops[i0+1];
    for(let i=0;i<=S;i++){const ph=i/S*Math.PI*2,c=Math.cos(ph),s=Math.sin(ph);pos.push(p[0],p[1]*c,p[1]*s);nor.push(p[2],p[3]*c,p[3]*s);col.push(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f)}});
  for(let j=0;j<prof.length-1;j++)for(let i=0;i<S;i++){const a=j*(S+1)+i,b=a+S+1,c=a+1,d=b+1;if(sign>0)idx.push(a,c,b,b,c,d);else idx.push(a,b,c,b,d,c)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);return g;
}
// clear half: almost colourless. blue half: sky blue that shifts to violet toward the tip, as in the logo
const gClear=halfGeo(-1,[[.975,.988,1],[.955,.972,1],[.90,.93,1]]),RAMPS=[[[.50,.80,1],[.43,.73,1],[.47,.64,1],[.64,.58,1]],[[.55,.93,.72],[.40,.86,.60],[.38,.80,.64],[.48,.80,.80]],[[1,.82,.50],[1,.72,.38],[1,.63,.38],[1,.58,.50]],[[.78,.70,1],[.69,.58,1],[.67,.50,.98],[.84,.55,.96]],[[1,.72,.82],[1,.60,.73],[.98,.52,.72],[.96,.58,.88]]],gCol=RAMPS.map(r=>halfGeo(1,r));
const HC=L/4; // centre of one half, so a broken half turns about its own centre of mass
const gClearH=gClear.clone();gClearH.translate(HC,0,0);const gColH=gCol.map(g=>{const k=g.clone();k.translate(-HC,0,0);return k});
function glass(side){return new THREE.MeshPhysicalMaterial({color:0xffffff,vertexColors:true,metalness:0,roughness:0,transmission:1,thickness:.34,ior:1.47,envMapIntensity:.55,side:side})}
const mGlassF=glass(THREE.FrontSide),mGlassD=glass(THREE.DoubleSide);
// drawn over the glass: bright rim, a soft band of light that stays on the upper side, and deeper colour low down, like a filled gel capsule
const mOver=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,
  vertexShader:'varying vec3 vN;varying vec3 vV;varying vec3 vWN;varying vec3 vC;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vV=normalize(-mv.xyz);vWN=normalize(mat3(modelMatrix)*normal);vC=color;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying vec3 vN;varying vec3 vV;varying vec3 vWN;varying vec3 vC;void main(){vec3 n=normalize(vN);float ndv=clamp(dot(n,normalize(vV)),0.0,1.0);float fres=1.0-ndv;float ny=normalize(vWN).y;float sat=clamp((1.0-min(vC.r,min(vC.g,vC.b)))*2.2,0.1,1.0);float aW=clamp(pow(fres,3.0)*0.5+smoothstep(0.5,0.72,ny)*smoothstep(0.97,0.8,ny)*0.32*ndv,0.0,0.85);vec3 deep=vC*vC*0.9;float aT=(smoothstep(0.25,-0.85,ny)*0.34+pow(fres,1.5)*0.22)*sat;float a=aT+aW-aT*aW;vec3 col=(deep*aT*(1.0-aW)+vec3(1.0)*aW)/max(a,0.0001);gl_FragColor=vec4(col,a);}'});
const over=g=>{const m=new THREE.Mesh(g,mOver);m.scale.setScalar(1.004);m.userData.noShadow=true;return m};
const shardMats=[[0xffffff,0xa9d6ff,0xb4b0ff],[0xffffff,0xa8ecc6,0xbfe9e0],[0xffffff,0xffd09c,0xffbfa0],[0xffffff,0xcbb8ff,0xe0b4f5],[0xffffff,0xffb8cf,0xf5b8e6]].map(a=>a.map(c=>new THREE.MeshPhysicalMaterial({color:c,metalness:0,roughness:0,transmission:1,thickness:.1,ior:1.47,envMapIntensity:.8,side:THREE.DoubleSide})));
const GHEX=[0x4a8cf0,0x35b877,0xf59a3c,0x8a6cf0,0xee6f9c],CAUS=[0xcfccff,0xc4f5d8,0xffe0b8,0xe0d0ff,0xffd0e0];let spawnN=Math.floor(Math.random()*5);

const gSeam=new THREE.TorusGeometry(R*1.004,.011,8,40);gSeam.rotateY(Math.PI/2);
const mSeam=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.1,transparent:true,opacity:.35});
const gCaustic=new THREE.PlaneGeometry(1.9,1.0);
const gShard=new THREE.TetrahedronGeometry(.07);
const objs=[];
function addObj(kind,body,mesh,extra){
  mesh.traverse(o=>{if(o.isMesh)o.castShadow=!o.userData.noShadow});scene.add(mesh);world.addBody(body);
  const rec=Object.assign({kind:kind,body:body,mesh:mesh},extra||{});mesh.userData.rec=rec;objs.push(rec);
  body.addEventListener('collide',e=>{const v=Math.abs(e.contact.getImpactVelocityAlongNormal());if(v>1.4)clack(v,e.body&&e.body.material===mGlass,kind==='shard')});
  while(objs.length>80)removeObj(objs[0]);
  return rec;
}
function removeObj(rec){const i=objs.indexOf(rec);if(i>=0)objs.splice(i,1);scene.remove(rec.mesh);if(rec.caustic){scene.remove(rec.caustic);rec.caustic.material.dispose()}removeBody(rec.body)}
function glassBody(mass,xs){
  const b=new CANNON.Body({mass:mass,material:mGlass});xs.forEach(x=>b.addShape(new CANNON.Sphere(R),new CANNON.Vec3(x,0,0)));
  b.collisionFilterGroup=2;b.collisionFilterMask=3;b.linearDamping=.04;b.angularDamping=.3;b.allowSleep=true;b.sleepSpeedLimit=.18;b.sleepTimeLimit=.7;return b;
}
const tmpV=new THREE.Vector3(),tmpQ=new THREE.Quaternion(),AX=new THREE.Vector3(1,0,0);
function spawnPill(){
  const gi=spawnN++%5,mesh=new THREE.Group();mesh.add(new THREE.Mesh(gClear,mGlassF),new THREE.Mesh(gCol[gi],mGlassF),over(gClear),over(gCol[gi]),new THREE.Mesh(gSeam,mSeam));
  const body=glassBody(1,[-.36,-.18,0,.18,.36]);
  pouch.updateMatrixWorld();
  const p=pouch.localToWorld(tmpV.set(rand(-.9,.9),VT*PH-.35,rand(-.15,.15)));
  const dir=new THREE.Vector3(0,1,0).applyQuaternion(pouch.quaternion);
  body.position.set(p.x,p.y,p.z);
  tmpQ.setFromUnitVectors(AX,dir);body.quaternion.set(tmpQ.x,tmpQ.y,tmpQ.z,tmpQ.w);
  const sp=rand(2.2,3.8);body.velocity.set(dir.x*sp+rand(-.8,.8),dir.y*sp,dir.z*sp+rand(-.4,.4));
  body.angularVelocity.set(rand(-4,4),rand(-4,4),rand(-4,4));
  const caustic=new THREE.Mesh(gCaustic,new THREE.MeshBasicMaterial({map:glowTex,color:CAUS[gi],transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  caustic.rotation.order='XYZ';caustic.position.y=.008;scene.add(caustic);
  addObj('pill',body,mesh,{caustic:caustic,genre:gi});
  whoosh();
}
let cracked=0;const flashes=[];
function crack(rec){
  const gi=rec.genre||0,b=rec.body,q=new THREE.Quaternion(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
  const axis=new THREE.Vector3(1,0,0).applyQuaternion(q),pos=new THREE.Vector3(b.position.x,b.position.y,b.position.z),vel=b.velocity;
  removeObj(rec);
  const perp=new THREE.Vector3(-axis.z,0,axis.x);if(perp.lengthSq()<1e-4)perp.set(1,0,0);perp.normalize();
  [-1,1].forEach(s=>{
    // each half is its own body centred on its own mass, released with a small push and left to physics
    const mesh=new THREE.Group();mesh.add(new THREE.Mesh(s<0?gClearH:gColH[gi],mGlassD),over(s<0?gClearH:gColH[gi]));
    const hb=glassBody(.5,[-.09,.09]),off=s*(HC+.05);
    hb.position.set(pos.x+axis.x*off,pos.y+axis.y*off+.02,pos.z+axis.z*off);hb.quaternion.set(q.x,q.y,q.z,q.w);
    const push=rand(1.1,1.6);hb.velocity.set(vel.x+axis.x*s*push,Math.max(vel.y,0)+rand(1.2,1.8),vel.z+axis.z*s*push);
    const tw=s*rand(1.5,3),roll=rand(-2.5,2.5);hb.angularVelocity.set(perp.x*tw+axis.x*roll,axis.y*roll,perp.z*tw+axis.z*roll);
    addObj('half',hb,mesh);
  });
  for(let i=0;i<14;i++){
    const mesh=new THREE.Mesh(gShard,shardMats[gi][Math.floor(Math.random()*3)]);mesh.scale.setScalar(rand(.5,1.1));
    const sb=new CANNON.Body({mass:.03,material:mGlass});sb.addShape(new CANNON.Sphere(.05));sb.collisionFilterGroup=4;sb.collisionFilterMask=1;sb.linearDamping=.1;sb.angularDamping=.4;sb.allowSleep=true;sb.sleepSpeedLimit=.2;sb.sleepTimeLimit=.5;
    sb.position.set(pos.x+rand(-.1,.1),pos.y+.1,pos.z+rand(-.1,.1));sb.velocity.set(rand(-2.4,2.4),rand(2,4.5),rand(-2.4,2.4));sb.angularVelocity.set(rand(-9,9),rand(-9,9),rand(-9,9));
    addObj('shard',sb,mesh);
  }
  burst(pos,gi);shatter();cracked++;showCard(gi);
}
const gRing=new THREE.RingGeometry(.84,1,64);const sparks=[],rings=[];let camKick=0;
function burst(pos){ // the original small flash only
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
  sp.position.copy(pos);sp.scale.setScalar(.6);scene.add(sp);flashes.push({sp:sp,t:0,grow:3.2,dur:.4});
}
function showCard(gi){
  const prescribed=cracked%3===0,card=$('card');
  $('cGenre').textContent=GENRES[gi]+(prescribed?'（ふだん読まない分野）':'');
  $('cDose').textContent=dose===3&&cracked<=3?('本日 '+cracked+' / 3 錠'):('検証用 '+cracked+' 錠目');
  card.style.borderTop='6px solid '+GCOL[gi];card.hidden=false;
}
$('cClose').addEventListener('click',()=>{$('card').hidden=true});

/* ----- sound (starts on the first tap) ----- */
let audio=null,muted=false,lastClack=0;
function ensureAudio(){if(audio||muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}catch(e){audio=null}}
function tone(freq,vol,dur,type,when){if(!audio||muted)return;const now=audio.currentTime+(when||0),o=audio.createOscillator(),g=audio.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+dur+.02)}
function clack(v,onGlass,small){if(!audio||muted)return;const now=audio.currentTime;if(now-lastClack<.03)return;lastClack=now;const vol=Math.min(.2,v*.014)*(small?.4:1);tone((onGlass?2900:1900)+rand(0,900)+(small?1500:0),vol,.07);tone(onGlass?520:210,vol*.9,.05,'triangle')}
function whoosh(){tone(rand(240,300),.03,.12,'triangle')}
function shatter(){for(let i=0;i<6;i++)tone(rand(2600,5200),.07,.12,'sine',i*.012);tone(160,.12,.1,'triangle')}
$('bSound').addEventListener('click',e=>{muted=!muted;e.currentTarget.setAttribute('aria-pressed',muted?'false':'true');if(!muted)ensureAudio()});

/* ----- sequencing ----- */
let seq=[],seqT=0,busy=false,dose=3;
function runSeq(items){seq=items.map(o=>Object.assign({done:false},o));seqT=0;busy=true}
function stepSeq(dt){
  if(!busy)return;seqT+=dt;let all=true;
  for(const s of seq){if(s.done)continue;if(seqT>=s.at){if(s.dur){const p=Math.min(1,(seqT-s.at)/s.dur);s.fn(p);if(p>=1)s.done=true}else{s.fn();s.done=true}}if(!s.done)all=false}
  if(all)busy=false;
}
function pour(){
  if(busy)return;$('hint').hidden=true;const items=[];let t=0;
  items.push({at:0,dur:.26,fn:p=>{const k=Math.sin(p*Math.PI);pouch.scale.set(1+.03*k,1-.04*k,1+.03*k)}});
  if(!opened){items.push({at:.05,dur:.65,fn:tearHeader});items.push({at:.45,dur:.55,fn:p=>setOpen(.92*easeOut(p))});t=1.0;opened=true}
  items.push({at:t,dur:.75,fn:p=>tip(easeInOut(p))});
  const gap=dose>8?.1:dose>3?.14:.22;
  for(let i=0;i<dose;i++)items.push({at:t+.62+i*gap,fn:spawnPill});
  const te=t+.62+dose*gap+.45;items.push({at:te,dur:.8,fn:p=>tip(1-easeInOut(p))});
  runSeq(items);
}
function reset(){
  while(objs.length)removeObj(objs[0]);busy=false;seq=[];opened=false;cracked=0;
  setOpen(0);tip(0);pouch.scale.set(1,1,1);header.visible=true;header.position.copy(headerHome);header.rotation.set(0,0,0);
  $('card').hidden=true;$('hint').hidden=false;
}
$('bReset').addEventListener('click',reset);
$('bShake').addEventListener('click',()=>{ensureAudio();objs.forEach(o=>{const b=o.body;b.wakeUp();b.velocity.set(b.velocity.x+rand(-7,7),b.velocity.y+rand(3,7),b.velocity.z+rand(-6,6));b.angularVelocity.set(rand(-8,8),rand(-8,8),rand(-8,8))})});
document.querySelectorAll('#variants button').forEach(b=>b.addEventListener('click',()=>applyVariant(+b.dataset.v)));
document.querySelectorAll('#counts button').forEach(b=>b.addEventListener('click',()=>{dose=+b.dataset.n;document.querySelectorAll('#counts button').forEach(o=>o.setAttribute('aria-pressed',o===b?'true':'false'))}));

/* ----- picking ----- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),camBase=new THREE.Vector3();
function pick(ev){
  const r=canvas.getBoundingClientRect();ptr.set((ev.clientX-r.left)/r.width*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(objs.map(o=>o.mesh).concat([pouch]),true);
  for(const h of hits){let o=h.object;while(o){if(o.userData.rec)return o.userData.rec;if(o.userData.pouch)return 'pouch';o=o.parent}}
  return null;
}
canvas.addEventListener('click',ev=>{ensureAudio();if(audio&&audio.state==='suspended')audio.resume();const h=pick(ev);if(h==='pouch')pour();else if(h&&h.kind==='pill')crack(h)});
canvas.addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse')return;const h=pick(ev);canvas.style.cursor=(h==='pouch'||(h&&h.kind==='pill'))?'pointer':'default'});

/* ----- layout ----- */
function fit(){
  const w=stage.clientWidth||1,h=stage.clientHeight||1;renderer.setSize(w,h,false);const a=w/h,f=Math.max(1,.92/a),dist=24*f;
  camera.aspect=a;camera.position.copy(target).addScaledVector(camDir,dist);camera.lookAt(target);camera.updateProjectionMatrix();camBase.copy(camera.position);
  const halfX=clamp(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*a*dist*.78,2.7,6.5);
  wL.position.set(-halfX,0,0);wR.position.set(halfX,0,0);
}
window.addEventListener('resize',fit);fit();
applyVariant(0);

/* ----- loop ----- */
const clock=new THREE.Clock();let time=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05);time+=dt;
  stepSeq(dt);
  if(!busy&&!reduced)pouch.rotation.z=Math.sin(time*1.3)*(opened?.006:.014);
  else pouch.rotation.z=tipK>.9?Math.sin(time*34)*.018:0;
  world.step(1/120,dt,8);
  for(const o of objs){
    const b=o.body;o.mesh.position.set(b.position.x,b.position.y,b.position.z);o.mesh.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
    if(o.caustic){tmpV.set(1,0,0).applyQuaternion(o.mesh.quaternion);const flat=1-Math.abs(tmpV.y);o.caustic.position.set(b.position.x+.1,.008,b.position.z-.12);o.caustic.rotation.set(-Math.PI/2,0,Math.atan2(-tmpV.z,tmpV.x));o.caustic.material.opacity=clamp(1-(b.position.y-R)/1.4,0,1)*.5*flat}
    if(b.position.y<-5)b.position.set(0,3,3);
  }
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.t+=dt;const p=f.t/f.dur;f.sp.scale.setScalar(.6+f.grow*easeOut(Math.min(1,p)));f.sp.material.opacity=Math.max(0,1-p);if(p>=1){scene.remove(f.sp);f.sp.material.dispose();flashes.splice(i,1)}}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;if(r.t<0)continue;const p=r.t/r.dur;r.m.scale.setScalar(.2+r.max*easeOut(Math.min(1,p)));r.m.material.opacity=.6*Math.max(0,1-p);if(p>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;s.v.y-=16*dt;s.sp.position.addScaledVector(s.v,dt);if(s.sp.position.y<.06){s.sp.position.y=.06;s.v.y*=-.45;s.v.x*=.7;s.v.z*=.7}const p=s.t/s.max;s.sp.material.opacity=Math.max(0,1-p*p)*(.65+.35*Math.sin(time*38+s.ph));s.sp.scale.setScalar(s.sz*(1-.4*p));if(p>=1){scene.remove(s.sp);s.sp.material.dispose();sparks.splice(i,1)}}
  if(camKick>0){camKick=Math.max(0,camKick-dt*5);const k=camKick*camKick;camera.position.copy(camBase).addScaledVector(camDir,-.9*k);camera.position.x+=rand(-.04,.04)*k;camera.position.y+=rand(-.04,.04)*k}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
})();
</script>
